[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "boto3>=1.44.9",
    "dropbox>=12.2.1",
    "fastapi>=0.103.2",
    "spotdl>=4.5.2",
    "streamrip>=2.1.0",
    "uvicorn[standard]>=0.23.2",
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
